services:
  vllm:
    command: >
      --model nvidia/Qwen3.6-35B-A3B-NVFP4 --served-model-name nvidia/Qwen3.6-35B-A3B-NVFP4 --host 0.0.0.0 --port 8000 --max-model-len 32768 --gpu-memory-utilization 0.80 --max-num-seqs 256 --enable-prompt-tokens-details --trust-remote-code --attention-backend flashinfer --enable-auto-tool-choice --kv-cache-dtype fp8 --moe-backend marlin --reasoning-parser qwen3 --tool-call-parser qwen3_coder --async-scheduling
