# Big-tier override. Measured weight footprint: 328.11 GB vs 288 GB HBM3e (GB300).
# (hfdl, 2026-09-16. Prior comment claimed 298.1 GB; the offload below predates that
# correction but still holds.) Weights exceed HBM; 100 GB spills to Grace LPDDR ->
# 228.1 GB resident against a 265 GB budget (0.92 util), leaving ~37 GB for KV.
# Tighter than the ~47 GB the other big-tier entries get, but workable. A55B active,
# so only part of the expert set crosses NVLink-C2C per token.
services:
  vllm:
    command: >
      --model nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4 --served-model-name nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4 --host 0.0.0.0 --port 8000 --max-model-len 32768 --gpu-memory-utilization 0.92 --cpu-offload-gb 100 --max-num-seqs 256 --enable-prompt-tokens-details --trust-remote-code --reasoning-parser nemotron_v3 --kv-cache-dtype fp8 --async-scheduling
    healthcheck:
      start_period: 3600s
